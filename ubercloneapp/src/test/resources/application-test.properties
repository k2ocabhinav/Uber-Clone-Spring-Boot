spring.application.name=ubercloneapp

#DB configuration - test database
spring.datasource.url=jdbc:postgresql://localhost:5432/testpostgres
spring.datasource.username=postgres
spring.datasource.password=user
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JWT config
jwt.secret=testSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512Algorithm123456789
jwt.expiration=86400000