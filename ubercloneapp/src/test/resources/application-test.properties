spring.application.name=ubercloneapp

#DB configuration - test database
spring.datasource.url=jdbc:postgresql://localhost:5432/testpostgres
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.data.redis.repositories.enabled=false

# JWT config
jwt.secret=testSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512Algorithm123456789
jwt.expiration=86400000
