spring.application.name=ubercloneapp

# Platform Configuration
app.platform.commission-rate=0.30
app.platform.driver-rating-threshold=4.8

# Fare Configuration
app.fare.base-fare=5.0
app.fare.per-km-rate=10.0
app.fare.surge-start-hour=18
app.fare.surge-end-hour=21
app.fare.surge-multiplier=2.0
app.fare.high-rated-rider-threshold=4.8

#DB configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?useSSL=false
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS postgis
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# JWT Configuration
jwt.secret=changeThisJwtSecretKeyForLocalDevelopmentOnly1234567890
jwt.expiration=86400000
